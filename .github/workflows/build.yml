name: Build QuestFiles APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "No gradlew found – generating basic wrapper"
            gradle wrapper --gradle-version 8.7 || true
            chmod +x gradlew || true
          fi

      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper missing. Please open the project in Android Studio once and commit the gradle/wrapper folder."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestFiles-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn
