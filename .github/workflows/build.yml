name: Build QuestFiles APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore app/release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias questfiles \
            -storepass questfiles123 \
            -keypass questfiles123 \
            -dname "CN=QuestFiles, OU=Tvman4, O=Tvman4, L=Unknown, ST=Unknown, C=US"

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: app/release.jks
          KEYSTORE_PASSWORD: questfiles123
          KEY_ALIAS: questfiles
          KEY_PASSWORD: questfiles123
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestFiles-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
